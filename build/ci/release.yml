name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.6.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Verify
        shell: pwsh
        run: |
          ./build/Test-Drift.ps1
          ./build/Test-Repository.ps1
          ./build/Invoke-Tests.ps1 -CI
      - name: Check tag matches VERSION
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match VERSION $v" }
      - name: Build package
        shell: pwsh
        run: ./build/Build-Package.ps1
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Spec Kit Radzen $GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md
