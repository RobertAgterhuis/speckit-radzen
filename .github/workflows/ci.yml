name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install test modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.6.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Static analysis (PSScriptAnalyzer)
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path tools, build, install -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer errors found.' }

      - name: Adapter drift check
        shell: pwsh
        run: ./build/Test-Drift.ps1

      - name: Repository self-checks (schemas, catalog, links, secrets)
        shell: pwsh
        run: ./build/Test-Repository.ps1

      - name: Pester (unit + integration)
        shell: pwsh
        run: ./build/Invoke-Tests.ps1 -CI -IncludeBuild:${{ runner.os != 'macOS' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/results/

  bash-bootstrap:
    name: bash bootstrap (bash 3.2 compatible)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check with system bash
        run: /bin/bash -n install/install.sh
      - name: Install into a temp repo
        run: |
          mkdir -p /tmp/target && git -C /tmp/target init -q
          /bin/bash install/install.sh /tmp/target --agents generic --yes
          test -f /tmp/target/.speckit/radzen/install-manifest.json

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !tests/fixtures/**
            !integrations/**

  package:
    needs: [test, bash-bootstrap, markdown]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build distribution
        shell: pwsh
        run: ./build/Build-Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: speckit-radzen-dist
          path: dist/
